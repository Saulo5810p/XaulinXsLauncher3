buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.0.21-1.0.26'
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.4'

        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.protobuf'

android {
    namespace 'com.android.launcher3'
    compileSdk 36

    defaultConfig {
        applicationId "com.android.launcher3"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "boolean", "IS_DEBUG_DEVICE", "false"
        buildConfigField "boolean", "NOTIFICATION_DOTS_ENABLED", "true"
        buildConfigField "boolean", "QSB_ON_FIRST_SCREEN", "true"
        buildConfigField "boolean", "WIDGETS_ENABLED", "true"
        buildConfigField "boolean", "IS_STUDIO_BUILD", "false"
        buildConfigField "String", "ACCESS_LAUNCHER_DATA", "\"com.android.launcher3.permission.ACCESS_LAUNCHER_DATA\""
    }

    flavorDimensions "recents"

    productFlavors {
        noQuickstep {
            dimension "recents"
        }
        withQuickstep {
            dimension "recents"
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [
                'src',
                'src_plugins',
                'framework-compat',
                'aosp-stubs',
                'dagger/src',
                'shared/src',
                'modules/concurrent/src',
                'deferred-appfunctions-widgetpicker',
                'modules/widgetpicker/src',
                'modules/customizations/src',
                'iconloader/src',
                'animationlib/src',
            ]
            res.srcDirs = [
                'res',
                'modules/widgetpicker/res',
                'iconloader/res',
                'animationlib/res',
            ]
            assets.srcDirs = ['assets']
            proto {
                srcDirs 'protos', 'protos_overrides'
            }
        }
        noQuickstep {
            java.srcDirs = ['src_no_quickstep']
            res.srcDirs = [
                'src_no_quickstep/res',
                'resliblauncher'
            ]
        }
        withQuickstep {
            java.srcDirs = ['src_ui_overrides', 'quickstep/src']
            res.srcDirs = ['quickstep/res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
            "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
            "-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=androidx.compose.ui.ExperimentalComposeUiApi",
            "-Xjvm-default=all",
        ]
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // XaulinXs Customizations: usuário pediu shrink também no
            // Debug (fluxo real de build é sempre assembleNoQuickstepDebug,
            // nunca Release). SourceFile/LineNumberTable ficam preservados
            // (ver proguard-xaulinxs.pro) para que um crash em logcat
            // continue apontando pro arquivo/linha certos mesmo com nomes
            // de classe ofuscados — mesmo método de diagnóstico já usado
            // nos crashes anteriores continua funcionando.
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard.flags',
                'proguard-xaulinxs.pro',
            )
        }
        release {
            // XaulinXs Customizations: redução real de tamanho do APK.
            // minifyEnabled ativa o R8 (remove classes/métodos/campos não
            // referenciados — inclusive os milhares de ícones não usados
            // de material-icons-extended, que é código Kotlin comum, não
            // recurso, então o shrink de CÓDIGO já cobre isso sozinho).
            // shrinkResources depende de minifyEnabled e remove
            // drawables/layouts/strings não referenciados.
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard.flags',
                'proguard-xaulinxs.pro',
            )
        }
    }
}

protobuf {
    protoc {
        path = '/data/data/com.termux/files/usr/bin/protoc'
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.graphics:graphics-shapes:1.1.0'
    implementation 'androidx.core:core-animation:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.3'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.window:window:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.google.guava:guava:33.3.1-android'

    implementation 'com.google.dagger:dagger:2.52'
    ksp 'com.google.dagger:dagger-compiler:2.52'
    implementation 'javax.inject:javax.inject:1'
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    implementation 'androidx.activity:activity-compose:1.10.0'

    implementation 'androidx.slice:slice-core:1.1.0-alpha02'
    implementation 'com.google.protobuf:protobuf-javalite:4.35.1'
}
